name: Deploy preview (Taxi + Lucravie)

# Publica o site do TaxiRota (raiz, inalterado) e adiciona a landing page
# da Lucravie Financas em /lucravie. Roda apenas nesta branch de preview.

on:
  push:
    branches: [claude/hyliox-research-cPYZg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (arquivos do TaxiRota na raiz)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build da Lucravie em ./lucravie
        run: |
          git clone --depth 1 --branch claude/hyliox-research-cPYZg https://github.com/videon8n/Tudo-que-lembra-.git /tmp/lucravie
          cd /tmp/lucravie
          npm install
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/lucravie"
          cp -r dist/. "$GITHUB_WORKSPACE/lucravie/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (taxi + lucravie)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
